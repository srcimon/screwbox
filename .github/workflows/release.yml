name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Define the release version"
        required: true
        default: ""
      developmentVersion:
        description: "Define the snapshot version"
        required: true
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Set up Maven Central Repository"
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'f
          java-package: 'jdk'
          cache: 'maven'
          server-id: ossrh

      - name: Set up Maven 3.9.9 # (required due to https://github.com/mavenplugins/central-publishing-maven-plugin/issues/79)
        uses: batmahdi/setup-maven@f81c845fbbaa97e79d46bc3aefed2ee6643346f7 # v3.37.0
        with:
          maven-version: '3.9.9'

      - name: Configure Git User
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@1c06494168d0ed3f75efd4e4e0c8412310a0b87a # v7.0.0
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Release With Maven
        run: |
          mvn -B -U \
            -Prelease-to-maven-central \
            release:prepare \
            release:perform \
            javadoc:jar \
            source:jar \
            -s ./.github/settings.xml \
            -DreleaseVersion=${{ github.event.inputs.releaseVersion }} \
            -DdevelopmentVersion=${{ github.event.inputs.developmentVersion }} \
            deploy
        env:
          CENTRAL_USERNAME_TOKEN: ${{ secrets.CENTRAL_USERNAME_TOKEN }}
          CENTRAL_PASSWORD_TOKEN: ${{ secrets.CENTRAL_PASSWORD_TOKEN }}
      - name: Artifact Name
        shell: bash
        run: |
          echo "artifact_name=$(mvn org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> "$GITHUB_ENV"